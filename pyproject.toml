[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestick-ai-manager"
version = "0.1.0"
description = "Safe GameStick SD card catalog, verified backups, planned ROM updates and an optional LangChain guide"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
ai = ["langchain-openai>=0.3,<3", "pydantic>=2,<3", "python-dotenv>=1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
gamestick = "gamestick_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
